[program:licensing-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/api.teslim.unibooks.com.ng/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.teslim.unibooks.com.ng/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=10
